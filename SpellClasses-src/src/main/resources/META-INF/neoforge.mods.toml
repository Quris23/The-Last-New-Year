modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="spellclasses.mixins.json"

[[mixins]]
config="spellclasses.debug.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="irons_spellbooks"
    type="required"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="supplementaries"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"


[[dependencies.${mod_id}]]
    modId="cold_sweat"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Our resources redraw Cataclysm Spellbooks' Engineer armor; loading after that mod makes ours the ones that win.
[[dependencies.${mod_id}]]
    modId="cataclysm_spellbooks"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
